<main class="app-container">
  <h1 class="app-title">GitHub_Finder</h1>
  
  <div class="search-box">
    <input 
      #usernameInput 
      type="text" 
      class="brutal-input" 
      placeholder="Inserisci uno username GitHub..."
      (keyup.enter)="cercaUtente(usernameInput.value)"
    >
    <button class="brutal-btn" (click)="cercaUtente(usernameInput.value)">
      CERCA
    </button>
  </div>
  
  <!-- SCHEDA UTENTE -->
  <div class="brutal-card">
    
    <div class="card-header">
      <img src="https://avatars.githubusercontent.com/u/9919?v=4" alt="Avatar" class="brutal-avatar">
      <div class="user-info">
        <h2>GitHub</h2>
        <p class="username">&#64;github</p>
      </div>
    </div>
    
    <p class="bio">Costruiamo software per sviluppatori. Questo è un testo temporaneo per testare il design della scheda.</p>
    
    <!-- CSS Grid in azione -->
    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-label">REPOS</span>
        <span class="stat-value">402</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">FOLLOWER</span>
        <span class="stat-value">3.5M</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">FOLLOWING</span>
        <span class="stat-value">0</span>
      </div>
    </div>

    <a href="#" class="brutal-btn-link">Vedi Profilo GitHub</a>
    
  </div>
</main>
